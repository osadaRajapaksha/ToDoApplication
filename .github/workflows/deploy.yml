name: Deploy to AWS

on:
  push:
    branches:
      - master

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Build & test the Spring Boot backend
  # ─────────────────────────────────────────────────────────
  backend-build:
    name: Backend – Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: backend
        run: mvn package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/todoapp-0.0.1-SNAPSHOT.jar
          retention-days: 1

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy backend to EC2 via SSH
  # ─────────────────────────────────────────────────────────
  backend-deploy:
    name: Backend – Deploy to EC2
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/ec2_key
          -----BEGIN OPENSSH PRIVATE KEY-----
