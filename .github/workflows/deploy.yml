          -----END OPENSSH PRIVATE KEY-----
          EOF
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest code & rebuild on EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          MONGO_URI: ${{ secrets.SPRING_DATA_MONGODB_URI }}
          JWT_SECRET_VAL: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.APP_FRONTEND_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Write deploy script locally, scp it, then run it with env vars inline
          printf '#!/bin/bash\nset -e\nREPO=/home/ec2-user/ToDoApplication\nsudo chown -R ec2-user:ec2-user $REPO\ncd $REPO\ngit pull origin master\nprintf "SPRING_DATA_MONGODB_URI=%%s\nJWT_SECRET=%%s\nAPP_FRONTEND_URL=%%s\nGEMINI_API_KEY=%%s\n" "$MONGO_URI" "$JWT_SECRET_VAL" "$FRONTEND_URL" "$GEMINI_API_KEY" > .env\nsudo /usr/local/bin/docker-compose up -d --build\n' > /tmp/deploy.sh
          scp -i ~/.ssh/ec2_key /tmp/deploy.sh $EC2_USER@$EC2_HOST:/tmp/deploy.sh
          ssh -i ~/.ssh/ec2_key $EC2_USER@$EC2_HOST \
            "MONGO_URI='$MONGO_URI' JWT_SECRET_VAL='$JWT_SECRET_VAL' FRONTEND_URL='$FRONTEND_URL' GEMINI_API_KEY='$GEMINI_API_KEY' bash /tmp/deploy.sh"

      - name: Health check
        run: |
          echo "Waiting 30s for backend to start..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}:8080/api/auth/signin -X POST -H "Content-Type: application/json" -d '{"username":"_hc_","password":"_hc_"}')
          if [ "$STATUS" = "401" ] || [ "$STATUS" = "400" ]; then
            echo "Backend is up"
          else
            echo "Unexpected status: $STATUS"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────
  # JOB 3: Build & deploy Next.js frontend to S3 + CloudFront
  # ─────────────────────────────────────────────────────────
  frontend-deploy:
    name: Frontend – Build & Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js (static export)
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync to S3
        working-directory: frontend
        run: aws s3 sync out/ s3://${{ secrets.S3_BUCKET_NAME }}/ --delete --region us-east-1

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
